schemaVersion: 1.2

endpoints:
  # Organization visibility so the API can be published to the internal
  # developer portal and subscribed to by the Pitstop application - the
  # backend then reaches it through Choreo's gateway with a token. Not
  # Public: nothing outside the organization needs to call this.
  - name: smart-search
    displayName: Smart Search Service
    service:
      basePath: /
      port: 8001
    type: REST
    networkVisibilities:
      - Organization
    schemaFilePath: openapi.yaml
