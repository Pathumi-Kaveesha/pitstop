openapi: 3.1.0
info:
  title: Pitstop Smart Search
  version: 0.1.0
paths:
  /health:
    get:
      summary: Health
      operationId: health_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Health Health Get
  /ingest-drive-link:
    post:
      summary: Ingest Drive Link
      description: 'Indexes a document from a Google Drive link, or an ordinary public
        webpage, no local

        copy saved.


        Split either side of the response so document size doesn''t affect

        how long this takes to answer: metadata/text is resolved first (fast,

        catches real errors), then chunk/embed/store happens in the

        background - a failure there only reaches the log, not the caller.'
      operationId: ingest_drive_link_ingest_drive_link_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IngestDriveLinkRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Ingest Drive Link Ingest Drive Link Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /documents:
    get:
      summary: List Documents Endpoint
      description: The id of every indexed document, so the backend can remove chunks
        whose Pitstop content is gone.
      operationId: list_documents_endpoint_documents_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: false
                properties:
                  documentIds:
                    items:
                      type: string
                    type: array
                required:
                - documentIds
                type: object
                title: Response List Documents Endpoint Documents Get
  /documents/{document_id}:
    delete:
      summary: Delete Document Endpoint
      description: 'Removes a document''s chunks. Marks the id deleted first, so a

        background index for the same id discards its work instead of

        recreating what was just deleted. A never-indexed id gets a 404.'
      operationId: delete_document_endpoint_documents__document_id__delete
      parameters:
      - name: document_id
        in: path
        required: true
        schema:
          type: string
          pattern: ^[0-9]+$
          title: Document Id
      - name: x-admin-email
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Admin-Email
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Delete Document Endpoint Documents  Document Id  Delete
        '404':
          description: No indexed chunks found for this document id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /documents/{document_id}/status:
    get:
      summary: Get Document Status
      description: Whether a document has indexed pieces, and why its latest attempt
        failed, if it did.
      operationId: get_document_status_documents__document_id__status_get
      parameters:
      - name: document_id
        in: path
        required: true
        schema:
          type: string
          pattern: ^[0-9]+$
          title: Document Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Get Document Status Documents  Document Id  Status
                  Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /documents/{document_id}/source-check:
    post:
      summary: Check Document Source
      description: 'Whether the file or page behind an indexed document has changed since
        it was indexed: "changed" (index it again), "unchanged", "gone" (deleted, in the
        trash, or no longer shared with Pitstop), "unindexable" (it changed and can''t be indexed any
        more - with the reason), "unavailable" (still there and unchanged, but the rules no
        longer allow indexing it) or "unknown" (couldn''t tell - check again later).'
      operationId: check_document_source_documents__document_id__source_check_post
      parameters:
      - name: document_id
        in: path
        required: true
        schema:
          type: string
          pattern: ^[0-9]+$
          title: Document Id
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SourceCheckRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Check Document Source Documents  Document Id  Source Check
                  Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /search:
    get:
      summary: Search Endpoint
      description: 'Tool 1: embeds the query and finds the closest matches by score.

        Tool 2 (generate_answer) then writes an answer, but only runs when

        Tool 1 actually found something to ground it in. includeAnswer=false

        skips Tool 2, so the sources come back without waiting for the model.'
      operationId: search_endpoint_search_get
      parameters:
      - name: userQuery
        in: query
        required: true
        schema:
          type: string
          minLength: 1
          title: Userquery
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 50
          minimum: 1
          default: 10
          title: Limit
      - name: includeAnswer
        in: query
        required: false
        schema:
          type: boolean
          default: true
          title: Includeanswer
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Search Endpoint Search Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /compose:
    post:
      summary: Compose Endpoint
      description: 'Writes a short email, chat message, plain summary, explanation or something the salesperson describes

        themselves, from the excerpts of all the sources the backend sends. It never reads the index itself.'
      operationId: compose_endpoint_compose_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ComposeRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Compose Endpoint Compose Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    ComposePassage:
      properties:
        title:
          type: string
          maxLength: 300
          minLength: 1
          title: Title
        label:
          type: string
          maxLength: 100
          title: Label
        text:
          type: string
          maxLength: 4000
          title: Text
      type: object
      required:
      - title
      - label
      - text
      title: ComposePassage
    ComposeRequest:
      properties:
        intent:
          type: string
          enum:
          - email
          - chat
          - plain
          - explain
          - custom
          title: Intent
        query:
          type: string
          maxLength: 300
          minLength: 1
          title: Query
        purpose:
          anyOf:
          - type: string
            maxLength: 500
          - type: 'null'
          title: Purpose
        passages:
          items:
            $ref: '#/components/schemas/ComposePassage'
          type: array
          maxItems: 10
          minItems: 1
          title: Passages
      type: object
      required:
      - intent
      - query
      - passages
      title: ComposeRequest
    ErrorResponse:
      properties:
        detail:
          type: string
          title: Detail
      type: object
      required:
      - detail
      title: ErrorResponse
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    IngestDriveLinkRequest:
      properties:
        driveLink:
          type: string
          title: Drivelink
        title:
          anyOf:
          - type: string
          - type: 'null'
          title: Title
        contentId:
          anyOf:
          - type: string
            pattern: ^[0-9]+$
          - type: 'null'
          title: Contentid
        displayLink:
          anyOf:
          - type: string
          - type: 'null'
          title: Displaylink
      type: object
      required:
      - driveLink
      title: IngestDriveLinkRequest
    SourceCheckRequest:
      properties:
        link:
          type: string
          maxLength: 2048
          minLength: 1
          title: Link
        indexedAt:
          anyOf:
          - type: integer
            minimum: 0
          - type: 'null'
          title: Indexedat
      type: object
      required:
      - link
      title: SourceCheckRequest
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
